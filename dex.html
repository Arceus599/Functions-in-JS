<html>

<head>
    <title>Function Expressions</title>
</head>

<body>
    <script>
        let oddeven = function (n) {
            if (n % 2 == 0){
        document.write(n + " is an even number. ");
            }
            else {

                document.write(n + " is an odd number. ");
            }

        }
        let n = prompt("Enter the number:")
        oddeven(n);
    </script>
</body>

</html>;
